name: Installer Native Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/installer-native.yml"
      - "CMakeLists.txt"
      - "cmake/CyxWizInstallerTargets.cmake"
      - "cmake/cyxwiz_installer_export.h"
      - "cyxwiz-backend/**"
      - "cyxwiz-engine/**"
      - "redist/bootstrapper/**"
      - "redist/scripts/prepare_backend_pack_repository.py"
      - "redist/scripts/verify_installer_package.py"
      - "redist/tests/test_prepare_backend_pack_repository.py"
      - "redist/tests/test_verify_installer_package.py"
      - "vcpkg-installer.json"
  push:
    branches:
      - main
      - Nodes_Implementation
    paths:
      - ".github/workflows/installer-native.yml"
      - "CMakeLists.txt"
      - "cmake/CyxWizInstallerTargets.cmake"
      - "cmake/cyxwiz_installer_export.h"
      - "cyxwiz-backend/**"
      - "cyxwiz-engine/**"
      - "redist/bootstrapper/**"
      - "redist/scripts/prepare_backend_pack_repository.py"
      - "redist/scripts/verify_installer_package.py"
      - "redist/tests/test_prepare_backend_pack_repository.py"
      - "redist/tests/test_verify_installer_package.py"
      - "vcpkg-installer.json"

permissions:
  contents: read

concurrency:
  group: installer-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
          - name: Ubuntu x64
            os: ubuntu-22.04
            artifact: ubuntu-x64
          - name: macOS arm64
            os: macos-15
            artifact: macos-arm64
          - name: macOS Intel x64
            os: macos-15-intel
            artifact: macos-x64

    steps:
      - uses: actions/checkout@v4

      - name: Select OpenSSL 3 signing tool on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          openssl_bin="$(brew --prefix openssl@3)/bin"
          test -x "${openssl_bin}/openssl"
          echo "${openssl_bin}" >> "${GITHUB_PATH}"
          "${openssl_bin}/openssl" version

      - name: Run signed repository publication contract
        run: python -B -m unittest redist.tests.test_prepare_backend_pack_repository

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Free Ubuntu disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Install Ubuntu build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential cmake libtool \
            libgl1-mesa-dev libgtk-3-dev libwayland-dev \
            libxext-dev libxi-dev libxinerama-dev libxkbcommon-dev \
            libxcursor-dev libxrandr-dev ninja-build pkg-config

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake cmake libtool ninja pkg-config

      - name: Use installer vcpkg manifest
        run: cmake -E copy vcpkg-installer.json vcpkg.json

      - name: Setup vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          Set-Location vcpkg
          git checkout 594ad8871e1e8e45f8e626c015fd611163430207
          .\bootstrap-vcpkg.bat
          "VCPKG_ROOT=$PWD" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup vcpkg on Unix
        if: runner.os != 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          git checkout 594ad8871e1e8e45f8e626c015fd611163430207
          ./bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=$PWD" >> "$GITHUB_ENV"

      - name: Configure Windows Release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCYXWIZ_BUILD_INSTALLER_ONLY=ON `
            -DCYXWIZ_INSTALLER_BOOTSTRAP_METADATA_DIR="$PWD/build/installer-bootstrap-metadata" `
            -DCYXWIZ_BUILD_TESTS=ON

      - name: Configure Ubuntu Release
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DCYXWIZ_BUILD_INSTALLER_ONLY=ON \
            -DCYXWIZ_INSTALLER_BOOTSTRAP_METADATA_DIR="$GITHUB_WORKSPACE/build/installer-bootstrap-metadata" \
            -DCYXWIZ_BUILD_TESTS=ON

      - name: Configure macOS Release
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DCYXWIZ_BUILD_INSTALLER_ONLY=ON \
            -DCYXWIZ_INSTALLER_BOOTSTRAP_METADATA_DIR="$GITHUB_WORKSPACE/build/installer-bootstrap-metadata" \
            -DCYXWIZ_BUILD_TESTS=ON

      - name: Build installer targets on Windows
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Build installer targets on Unix
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      - name: Generate Windows signed metadata fixture
        if: runner.os == 'Windows'
        run: >-
          build/bin/Release/generate_installer_metadata_fixture.exe
          build/installer-bootstrap-metadata

      - name: Generate Unix signed metadata fixture
        if: runner.os != 'Windows'
        run: >-
          build/bin/generate_installer_metadata_fixture
          build/installer-bootstrap-metadata

      - name: Run native installer contracts
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Stage installer package
        run: cmake --install build --config Release --prefix installer-stage

      - name: Add Windows package smoke contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer-stage/smoke | Out-Null
          Get-ChildItem build/bin/Release/test_backend_pack_*.exe |
            Copy-Item -Destination installer-stage/smoke/
          @(
            "cyxwiz-product-removal-finalizer.exe",
            "cyxwiz-runtime-bootstrapper.exe",
            "test_runtime_bootstrapper.exe",
            "test_runtime_bootstrapper_child.exe",
            "test_installer_verification_summary.exe",
            "test_installer_product_removal.exe",
            "test_product_installation_receipt.exe",
            "test_product_removal_authorization.exe",
            "test_product_removal_cleanup.exe",
            "test_product_removal_quarantine.exe",
            "test_product_removal_finalizer.exe",
            "test_product_removal_finalizer_child.exe",
            "test_product_removal_handoff.exe",
            "test_product_removal_request.exe",
            "test_product_removal_transaction.exe",
            "test_product_registration.exe"
          ) | ForEach-Object {
            Copy-Item "build/bin/Release/$_" -Destination installer-stage/smoke/
          }

      - name: Add Unix package smoke contract
        if: runner.os != 'Windows'
        run: |
          mkdir -p installer-stage/smoke
          cp build/bin/test_backend_pack_* installer-stage/smoke/
          cp \
            build/bin/cyxwiz-product-removal-finalizer \
            build/bin/cyxwiz-runtime-bootstrapper \
            build/bin/test_runtime_bootstrapper \
            build/bin/test_runtime_bootstrapper_child \
            build/bin/test_installer_verification_summary \
            build/bin/test_installer_product_removal \
            build/bin/test_product_installation_receipt \
            build/bin/test_product_removal_authorization \
            build/bin/test_product_removal_cleanup \
            build/bin/test_product_removal_quarantine \
            build/bin/test_product_removal_finalizer \
            build/bin/test_product_removal_finalizer_child \
            build/bin/test_product_removal_handoff \
            build/bin/test_product_removal_request \
            build/bin/test_product_removal_transaction \
            build/bin/test_product_registration \
            installer-stage/smoke/

      - uses: actions/upload-artifact@v4
        with:
          name: cyxwiz-installer-${{ matrix.artifact }}
          path: installer-stage/
          if-no-files-found: error

  package-smoke:
    name: ${{ matrix.name }} package smoke
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
          - name: Ubuntu x64
            os: ubuntu-22.04
            artifact: ubuntu-x64
          - name: macOS arm64
            os: macos-15
            artifact: macos-arm64
          - name: macOS Intel x64
            os: macos-15-intel
            artifact: macos-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cyxwiz-installer-${{ matrix.artifact }}
          path: installer-stage

      - name: Run clean-machine evidence contract
        run: python -m unittest redist.tests.test_verify_installer_package

      - name: Verify staged package on fresh runner
        run: >-
          python redist/scripts/verify_installer_package.py installer-stage
          --artifact-id ${{ matrix.artifact }}
          --evidence clean-machine-evidence/${{ matrix.artifact }}.json

      - name: Upload clean-machine evidence
        uses: actions/upload-artifact@v4
        with:
          name: cyxwiz-installer-evidence-${{ matrix.artifact }}
          path: clean-machine-evidence/${{ matrix.artifact }}.json
          if-no-files-found: error
