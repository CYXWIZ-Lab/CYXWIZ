name: Installer Native Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/installer-native.yml"
      - "CMakeLists.txt"
      - "cmake/CyxWizInstallerTargets.cmake"
      - "cmake/cyxwiz_installer_export.h"
      - "cyxwiz-backend/**"
      - "cyxwiz-engine/**"
      - "redist/bootstrapper/**"
      - "redist/scripts/verify_installer_package.py"
      - "redist/tests/test_verify_installer_package.py"
      - "vcpkg-installer.json"
  push:
    branches:
      - main
      - Nodes_Implementation
    paths:
      - ".github/workflows/installer-native.yml"
      - "CMakeLists.txt"
      - "cmake/CyxWizInstallerTargets.cmake"
      - "cmake/cyxwiz_installer_export.h"
      - "cyxwiz-backend/**"
      - "cyxwiz-engine/**"
      - "redist/bootstrapper/**"
      - "redist/scripts/verify_installer_package.py"
      - "redist/tests/test_verify_installer_package.py"
      - "vcpkg-installer.json"

permissions:
  contents: read

concurrency:
  group: installer-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
          - name: Ubuntu x64
            os: ubuntu-22.04
            artifact: ubuntu-x64
          - name: macOS arm64
            os: macos-15
            artifact: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Free Ubuntu disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Install Ubuntu build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential cmake libtool \
            libgl1-mesa-dev libgtk-3-dev libwayland-dev \
            libxext-dev libxi-dev libxinerama-dev libxkbcommon-dev \
            libxcursor-dev libxrandr-dev ninja-build pkg-config

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake cmake libtool ninja pkg-config

      - name: Use installer vcpkg manifest
        run: cmake -E copy vcpkg-installer.json vcpkg.json

      - name: Setup vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          Set-Location vcpkg
          git checkout 594ad8871e1e8e45f8e626c015fd611163430207
          .\bootstrap-vcpkg.bat
          "VCPKG_ROOT=$PWD" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup vcpkg on Unix
        if: runner.os != 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          git checkout 594ad8871e1e8e45f8e626c015fd611163430207
          ./bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=$PWD" >> "$GITHUB_ENV"

      - name: Configure Windows Release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCYXWIZ_BUILD_INSTALLER_ONLY=ON `
            -DCYXWIZ_BUILD_TESTS=ON

      - name: Configure Ubuntu Release
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DCYXWIZ_BUILD_INSTALLER_ONLY=ON \
            -DCYXWIZ_BUILD_TESTS=ON

      - name: Configure macOS Release
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DCYXWIZ_BUILD_INSTALLER_ONLY=ON \
            -DCYXWIZ_BUILD_TESTS=ON

      - name: Build installer targets on Windows
        if: runner.os == 'Windows'
        run: >-
          cmake --build build --config Release --parallel
          --target cyxwiz-installer cyxwiz-backend-pack-installer
          test_backend_pack_manager_model test_backend_pack_state_service
          test_backend_pack_installer test_backend_pack_metadata_verifier
          test_backend_pack_delivery test_backend_pack_maintenance
          test_backend_pack_maintenance_request
          test_backend_pack_lifecycle_service

      - name: Build installer targets on Unix
        if: runner.os != 'Windows'
        run: >-
          cmake --build build --parallel
          --target cyxwiz-installer cyxwiz-backend-pack-installer
          test_backend_pack_manager_model test_backend_pack_state_service
          test_backend_pack_installer test_backend_pack_metadata_verifier
          test_backend_pack_delivery test_backend_pack_maintenance
          test_backend_pack_maintenance_request
          test_backend_pack_lifecycle_service

      - name: Run installer model contract
        run: >-
          ctest --test-dir build --build-config Release --output-on-failure
          -R ^backend_pack_manager_model_contract$

      - name: Stage installer package
        run: cmake --install build --config Release --prefix installer-stage

      - name: Add Windows package smoke contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer-stage/smoke | Out-Null
          Get-ChildItem build/bin/Release/test_backend_pack_*.exe |
            Copy-Item -Destination installer-stage/smoke/

      - name: Add Unix package smoke contract
        if: runner.os != 'Windows'
        run: |
          mkdir -p installer-stage/smoke
          cp build/bin/test_backend_pack_* installer-stage/smoke/

      - uses: actions/upload-artifact@v4
        with:
          name: cyxwiz-installer-${{ matrix.artifact }}
          path: installer-stage/
          if-no-files-found: error

  package-smoke:
    name: ${{ matrix.name }} package smoke
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
          - name: Ubuntu x64
            os: ubuntu-22.04
            artifact: ubuntu-x64
          - name: macOS arm64
            os: macos-15
            artifact: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cyxwiz-installer-${{ matrix.artifact }}
          path: installer-stage

      - name: Run clean-machine evidence contract
        run: python -m unittest redist.tests.test_verify_installer_package

      - name: Verify staged package on fresh runner
        run: >-
          python redist/scripts/verify_installer_package.py installer-stage
          --artifact-id ${{ matrix.artifact }}
          --evidence clean-machine-evidence/${{ matrix.artifact }}.json

      - name: Upload clean-machine evidence
        uses: actions/upload-artifact@v4
        with:
          name: cyxwiz-installer-evidence-${{ matrix.artifact }}
          path: clean-machine-evidence/${{ matrix.artifact }}.json
          if-no-files-found: error
