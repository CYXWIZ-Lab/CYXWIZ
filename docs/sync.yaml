# Where the docs of each area were last checked against the code.
#
# synced_at is a commit on the integration branch: the docs of that area
# describe the code as it was at that commit. After you update an area's
# pages, set synced_at to the commit you checked them against (usually HEAD).
#
#   python scripts/docs/docs_drift.py            every area: what changed since
#   python scripts/docs/docs_drift.py --files    also list the changed files
#
# code: git pathspecs (globs) of the code each area documents.
# An empty synced_at means the area has not been checked yet.

